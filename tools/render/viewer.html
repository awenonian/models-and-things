<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1d1b22}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const params = new URLSearchParams(location.search);
const W = +params.get('w') || 1400, H = +params.get('h') || 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1d1b22);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x302838, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-450, 420, 520);
key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 2000 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xaac0ff, 0.6); rim.position.set(400, 250, -300); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: 0x3a3440 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);
window.renderView = async (file, eye, target, fov) => {
  const geo = await new Promise((res, rej) => new STLLoader().load(file, res, undefined, rej));
  geo.rotateX(-Math.PI / 2); // model Z-up -> three Y-up (model +Y toward viewer becomes -Z)
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xc9c3b8, roughness: 0.75, metalness: 0.0, flatShading: false }));
  mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
  const cam = new THREE.PerspectiveCamera(fov || 35, W / H, 1, 5000);
  // eye/target given in model coords (x, y, z) z-up; convert
  const c = v => new THREE.Vector3(v[0], v[2], -v[1]);
  cam.position.copy(c(eye)); cam.lookAt(c(target));
  renderer.render(scene, cam);
  scene.remove(mesh);
  return true;
};
window.ready = true;
</script></body></html>
